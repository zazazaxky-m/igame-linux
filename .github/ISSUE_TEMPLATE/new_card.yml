name: Report another card
description: Help add support for another Colorful iGame card
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Lighting is only enabled for the controller type it was tested on. Your report tells us
        what your card looks like to the app.
  - type: input
    id: card
    attributes:
      label: Card model
      description: The exact name from the box or Colorful's website
      placeholder: Colorful iGame GeForce RTX 5080 Vulcan OC 16GB-V
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `igame-ctl status`
      description: The RGB line shows the controller model and type, or why it was not found.
      render: text
    validations:
      required: true
  - type: textarea
    id: pci
    attributes:
      label: PCI IDs
      description: Output of `lspci -nn -d 10de: -vv | grep -E "VGA|Subsystem"`
      render: text
    validations:
      required: true
  - type: textarea
    id: leds
    attributes:
      label: Lighting
      description: How many lighting zones does the card have, and does iGame Center on Windows control them?
  - type: textarea
    id: rest
    attributes:
      label: Do power, overclock and fans work?
